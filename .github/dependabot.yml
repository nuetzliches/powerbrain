version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/mcp-server"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/ingestion"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/pb-proxy"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/worker"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/reranker"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  # Requirements are pinned exactly (see CLAUDE.md "Dependency Pinning"), so a
  # directory that Dependabot does not watch never receives security patches.
  # The three entries below close that gap.
  - package-ecosystem: "pip"
    directory: "/" # requirements-dev.txt — test + security tooling
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/ingestion/adapters/office365"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/demo"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/mcp-server"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/ingestion"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/pb-proxy"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/worker"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/reranker"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
