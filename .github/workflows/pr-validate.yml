name: PR Validate

on:
  pull_request:
    branches: [development, master]
  # Requirements are resolved fresh on every run, so a dependency that ships a
  # breaking major between PRs only surfaces the next time CI runs. Without a
  # cadence that can be weeks, and the first symptom is a crashlooping image on
  # someone's machine. Weekly run against the default branch closes that gap.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run unit tests
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" -w /app python:3.12-slim bash -c "
            pip install --no-cache-dir -q \
              -r requirements-dev.txt \
              -r mcp-server/requirements.txt \
              -r ingestion/requirements.txt \
              -r ingestion/adapters/office365/requirements.txt \
              -r pb-proxy/requirements.txt \
              -r worker/requirements.txt \
              fastapi uvicorn pydantic prometheus-client pyyaml python-dotenv &&
            PYTHONPATH=.:mcp-server:ingestion:reranker:pb-proxy \
            python -m pytest \
              shared/tests \
              mcp-server/tests \
              ingestion/tests \
              ingestion/adapters/office365/tests \
              reranker/tests \
              pb-proxy/tests \
              worker/tests \
              -m 'not integration' \
              --tb=short -q \
              --cov=shared --cov=mcp-server --cov=ingestion \
              --cov=reranker --cov=pb-proxy --cov=worker \
              --cov-report=term-missing:skip-covered \
              --cov-fail-under=68
          "

  opa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download OPA
        run: |
          curl -sSL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa

      - name: Run OPA policy tests
        # Pass the whole opa-policies/ tree so OPA loads the root data.json
        # alongside the pb/ rule package.
        run: ./opa test opa-policies/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build mcp-server image
        run: docker build -f mcp-server/Dockerfile -t pb-mcp-server:pr-test .

      # `docker build` only runs pip install — it never imports the app. An
      # incompatible dependency bump therefore builds green and crashloops at
      # runtime. Importing the CMD module is the cheapest check that the image
      # can actually start. SKIP_INGESTION_AUTH_STARTUP_CHECK mirrors the test
      # conftests: it bypasses the fail-closed auth guard, which has no token to
      # find here and is not what this step is testing.
      - name: Smoke-import mcp-server
        run: |
          docker run --rm -e SKIP_INGESTION_AUTH_STARTUP_CHECK=true \
            pb-mcp-server:pr-test python -c "import server"

      - name: Build ingestion image
        run: docker build -f ingestion/Dockerfile -t pb-ingestion:pr-test .

      - name: Build reranker image
        run: docker build -f reranker/Dockerfile -t pb-reranker:pr-test .

      - name: Build pb-proxy image
        run: docker build -f pb-proxy/Dockerfile -t pb-proxy:pr-test .

      - name: Smoke-import pb-proxy
        run: |
          docker run --rm -e SKIP_INGESTION_AUTH_STARTUP_CHECK=true \
            pb-proxy:pr-test python -c "import proxy"

      - name: Build worker image
        run: docker build -f worker/Dockerfile -t pb-worker:pr-test .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Constrained rather than pinned inline: requirements-dev.txt already
      # carries the pins, and an unpinned `pip install` of the scanner is the
      # exact supply-chain hole this job exists to find — see CLAUDE.md
      # "Dependency Pinning".
      - name: Install scanning tools
        run: pip install --constraint requirements-dev.txt pip-audit bandit

      # pip-audit exits 1 when it finds something. The four invocations used to
      # be four plain lines under the default `bash -e`, so the first finding
      # aborted the step and the files after it were never audited at all —
      # while `continue-on-error` reported the job green. That is worse than no
      # audit, because the step claims coverage it did not deliver (#257).
      #
      # Every file is audited now and the statuses are collected. Coverage comes
      # from `git ls-files` instead of a hand-kept list, so a newly added
      # requirements file cannot be silently left out by being forgotten here —
      # the same gap `.github/dependabot.yml` guards against for updates.
      # `--strict` makes a dependency that could not be resolved a failure
      # rather than a skipped line in the middle of a passing run.
      #
      # `continue-on-error` stays: a CVE published in a transitive dependency
      # should not block every unrelated PR. It no longer hides the finding —
      # the result lands in the job summary and raises an annotation, so a
      # finding is distinguishable from a clean run at a glance.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          status=0
          rows=$(mktemp)
          details=$(mktemp)

          # Advisories assessed as not reachable from this codebase. Each one is
          # an entry in docs/dependency-audit.md carrying the assessment, a
          # review date and the triggers that reopen it — do not add a line here
          # without adding the entry there. Suppressed rather than tolerated,
          # because a summary that always shows the same findings trains
          # everyone to skip it, and this audit is only worth keeping
          # non-blocking as long as a reported finding means something new.
          ignore=(
            --ignore-vuln PYSEC-2026-3552  # cryptography: PKCS#7 decrypt oracle
            --ignore-vuln PYSEC-2026-3553  # cryptography: X.509 path-building DoS
            --ignore-vuln PYSEC-2026-3554  # cryptography: X.509 wildcard SAN escape
          )

          while IFS= read -r req; do
            log=$(mktemp)
            echo "::group::pip-audit $req"
            if pip-audit --strict "${ignore[@]}" -r "$req" >"$log" 2>&1; then
              printf '| `%s` | no known vulnerabilities |\n' "$req" >>"$rows"
            else
              status=1
              printf '| `%s` | :warning: **findings** |\n' "$req" >>"$rows"
              {
                printf '\n<details><summary><code>%s</code></summary>\n\n```\n' "$req"
                cat "$log"
                printf '```\n\n</details>\n'
              } >>"$details"
            fi
            cat "$log"
            echo "::endgroup::"
          done < <(git ls-files '*requirements*.txt')

          {
            echo "## Dependency audit (pip-audit)"
            echo
            echo "| requirements file | result |"
            echo "| --- | --- |"
            cat "$rows"
            cat "$details"
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            echo "::warning title=Dependency audit::pip-audit reported findings — see the job summary for the affected requirements files."
          fi
          exit "$status"

      # Same failure mode the audit above had (#257): bandit exits 1 on any
      # finding, `continue-on-error` turns that back into a green check, and a
      # finding becomes indistinguishable from a clean run unless somebody opens
      # the log. The result goes to the job summary and raises annotations now.
      #
      # The step used to invoke bandit twice — once for the JSON artifact, once
      # for console output. One run produces the JSON and the summary is
      # rendered from it, so the uploaded artifact and what you read can no
      # longer disagree.
      #
      # `continue-on-error` stays, for the same reason as the audit: a finding
      # in code the PR did not touch should not block it. What makes that
      # tolerable is that the expected steady state is zero — findings that were
      # assessed and accepted carry a `# nosec Bxxx` marker with the reason at
      # the point of use, and the summary reports how many were suppressed that
      # way, so suppressions cannot quietly accumulate.
      - name: Static security scan (bandit)
        continue-on-error: true
        run: |
          status=0
          bandit -r shared/ mcp-server/ ingestion/ reranker/ pb-proxy/ worker/ \
            -x '*/tests/*' \
            --severity-level medium \
            -f json -o bandit-report.json || status=$?

          # Rendered in Python rather than bash: the report is JSON, and the
          # setup-python step above already put an interpreter on PATH.
          python3 - "$status" <<'PY'
          import json
          import os
          import sys

          exit_status = int(sys.argv[1])

          with open("bandit-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          results = report.get("results", [])
          totals = report.get("metrics", {}).get("_totals", {})
          suppressed = int(totals.get("skipped_tests", 0) or 0)
          errors = report.get("errors", [])

          def cell(text):
              """Collapse whitespace and escape pipes so a message cannot break the table."""
              return " ".join(str(text).split()).replace("|", "\\|")

          out = ["## Static security scan (bandit)", ""]
          if results:
              out += [
                  f"**{len(results)} finding(s)** at or above medium severity.",
                  "",
                  "| file | line | test | severity / confidence | issue |",
                  "| --- | --- | --- | --- | --- |",
              ]
              out += [
                  "| `{}` | {} | [{}]({}) | {} / {} | {} |".format(
                      cell(r.get("filename")),
                      r.get("line_number"),
                      cell(r.get("test_id")),
                      r.get("more_info"),
                      cell(r.get("issue_severity")),
                      cell(r.get("issue_confidence")),
                      cell(r.get("issue_text")),
                  )
                  for r in results
              ]
          else:
              out.append("No findings at or above medium severity.")

          out += [
              "",
              f"{suppressed} finding(s) suppressed by reviewed `# nosec` markers "
              "(see the reason next to each marker in the source).",
          ]
          if errors:
              out += ["", "**Scan errors:**", "", "```", json.dumps(errors, indent=2), "```"]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")

          # File annotations attach each finding to its line in the PR view.
          for r in results:
              print("::warning file={},line={},title=bandit {}::{}".format(
                  r.get("filename"), r.get("line_number"),
                  r.get("test_id"), cell(r.get("issue_text")),
              ))
          if results:
              print(
                  "::warning title=Static security scan::bandit reported "
                  f"{len(results)} finding(s) — see the job summary."
              )
          # A file bandit could not parse is a hole in the scan's coverage, and
          # it does not show up as a finding — annotate it in its own right.
          if errors:
              print(
                  "::warning title=Static security scan::bandit could not scan "
                  f"{len(errors)} file(s) — see the job summary."
              )
          if exit_status != 0 and not results and not errors:
              print(
                  "::warning title=Static security scan::bandit exited "
                  f"{exit_status} without reporting findings — the scan may not have run."
              )
          PY

          exit "$status"

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
